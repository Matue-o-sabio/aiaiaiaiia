<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Video Player Neon</title>
    <style>
        :root {
            --bg-principal: #0a0c10;
            --bg-painel: #131720;
            --cor-primaria: #00f0ff;
            --cor-secundaria: #ff0055;
            --cor-texto: #e6edf3;
            --borda: #21262d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-principal);
            color: var(--cor-texto);
            font-family: 'Segoe UI', monospace, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            font-size: 2rem;
            color: var(--cor-primaria);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .container-principal {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }

        @media (max-width: 850px) {
            .container-principal {
                grid-template-columns: 1fr;
            }
        }

        /* Painel Lateral */
        .painel {
            background: var(--bg-painel);
            border: 1px solid var(--borda);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .secao-titulo {
            font-size: 0.9rem;
            color: var(--cor-primaria);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
            border-bottom: 1px solid var(--borda);
            padding-bottom: 6px;
        }

        /* Lista / Tabela de Vídeos */
        .tabela-videos {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 180px;
            overflow-y: auto;
        }

        .item-video {
            background: #1c212d;
            border: 1px solid transparent;
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .item-video:hover {
            border-color: var(--cor-primaria);
            background: #252b3b;
        }

        .item-video.ativo {
            border-color: var(--cor-secundaria);
            background: rgba(255, 0, 85, 0.15);
            color: #fff;
            font-weight: bold;
        }

        /* Controles de Entrada */
        .grupo-campo {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        input[type="url"], input[type="file"] {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--borda);
            background-color: #0d1117;
            color: var(--cor-texto);
            font-size: 0.85rem;
            outline: none;
        }

        input[type="url"]:focus {
            border-color: var(--cor-primaria);
        }

        /* Botões */
        button {
            padding: 10px 16px;
            font-size: 0.9rem;
            background: linear-gradient(135deg, #00f0ff, #0077ff);
            color: #000;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
        }

        #btn-play-pause {
            background: linear-gradient(135deg, #ff0055, #ff5500);
            color: #fff;
            padding: 12px;
        }

        /* Áudio */
        .controles-audio {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #0d1117;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--borda);
        }

        input[type="range"] {
            flex: 1;
            accent-color: var(--cor-primaria);
            cursor: pointer;
        }

        /* Visualizador do Canvas */
        .area-display {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #status {
            margin-bottom: 12px;
            color: var(--cor-primaria);
            font-size: 0.9rem;
            min-height: 20px;
        }

        #container-canvas {
            background-color: #000;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--borda);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.15);
        }

        canvas {
            display: block;
            border-radius: 4px;
        }

        video { display: none; }
    </style>
</head>
<body>

    <h1>ASCII Video Player</h1>

    <div class="container-principal">
        <!-- Painel de Controles -->
        <div class="painel">
            <div class="secao-titulo">Vídeos do Repositório</div>
            <div class="tabela-videos" id="lista-videos">
                <!-- Lista injetada dinamicamente pelo JavaScript -->
            </div>

            <div class="secao-titulo">Outras Fontes</div>
            <div class="grupo-campo">
                <input type="file" id="input-arquivo" accept="video/mp4,video/webm">
            </div>
            
            <div class="grupo-campo">
                <input type="url" id="input-url" placeholder="Cole uma URL direta (.mp4)">
                <button id="btn-carregar-url">Rodar URL</button>
            </div>

            <div class="secao-titulo">Controles de Áudio</div>
            <div class="controles-audio">
                <button id="btn-mute">Mudo</button>
                <input type="range" id="slider-volume" min="0" max="1" step="0.05" value="0.5">
                <span id="valor-volume">50%</span>
            </div>

            <button id="btn-play-pause">▶ Reproduzir / Pausar</button>
        </div>

        <!-- Área de Exibição -->
        <div class="area-display">
            <div id="status">Selecione um vídeo da lista ou carregue um arquivo...</div>
            <div id="container-canvas">
                <canvas id="ascii-canvas"></canvas>
            </div>
        </div>
    </div>

    <video id="video-oculto" loop playsinline></video>
    <canvas id="canvas-temp" style="display:none;"></canvas>

    <script>
        // LISTA DE VÍDEOS HOSPEDADOS NO GITHUB
        // Adicione aqui os nomes dos vídeos salvos na pasta do seu repositório
        const VIDEOS_GITHUB = [
            { titulo: "Fodase", arquivo: "https://matue-o-sabio.github.io/aiaiaiaiia/fodase.mp4" },
            { titulo: "Primo (GitHub)", arquivo: "https://matue-o-sabio.github.io/aiaiaiaiia/primo.mp4" },
            { titulo: "Jailson (GitHub)", arquivo: "https://matue-o-sabio.github.io/aiaiaiaiia/macho.mp4" }
        ];

        const ASCII_CHARS = " .'`^\",:;Il!i><~+_-?][}{1)(|/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$";

        const listaVideosElem = document.getElementById('lista-videos');
        const inputArquivo = document.getElementById('input-arquivo');
        const inputUrl = document.getElementById('input-url');
        const btnCarregarUrl = document.getElementById('btn-carregar-url');
        const btnPlayPause = document.getElementById('btn-play-pause');
        const statusDiv = document.getElementById('status');
        const video = document.getElementById('video-oculto');

        const btnMute = document.getElementById('btn-mute');
        const sliderVolume = document.getElementById('slider-volume');
        const valorVolume = document.getElementById('valor-volume');

        const canvasDisplay = document.getElementById('ascii-canvas');
        const ctxDisplay = canvasDisplay.getContext('2d');
        const canvasTemp = document.getElementById('canvas-temp');
        const ctxTemp = canvasTemp.getContext('2d');

        const larguraAscii = 95;
        const tamanhoFonte = 10;
        const larguraChar = tamanhoFonte * 0.6;
        const alturaChar = tamanhoFonte * 0.9;

        video.volume = 0.5;

        // Renderiza a lista de vídeos
        function carregarTabelaVideos() {
            listaVideosElem.innerHTML = '';
            VIDEOS_GITHUB.forEach((vid, index) => {
                const item = document.createElement('div');
                item.className = 'item-video';
                item.innerHTML = `<span>🎬 ${vid.titulo}</span> <span>▶</span>`;
                item.addEventListener('click', () => {
                    document.querySelectorAll('.item-video').forEach(el => el.classList.remove('ativo'));
                    item.classList.add('ativo');
                    carregarFonteVideo(vid.arquivo, true);
                });
                listaVideosElem.appendChild(item);
            });
        }

        carregarTabelaVideos();

        function carregarFonteVideo(src, ehExterno) {
            statusDiv.textContent = "Carregando fonte de vídeo...";
            if (ehExterno) {
                video.setAttribute('crossOrigin', 'anonymous');
            } else {
                video.removeAttribute('crossOrigin');
            }
            video.src = src;
            video.load();
        }

        // Controles de Volume e Mudo
        sliderVolume.addEventListener('input', (e) => {
            const vol = parseFloat(e.target.value);
            video.volume = vol;
            video.muted = false;
            valorVolume.textContent = Math.round(vol * 100) + '%';
        });

        btnMute.addEventListener('click', () => {
            video.muted = !video.muted;
            valorVolume.textContent = video.muted ? 'Mudo' : Math.round(video.volume * 100) + '%';
        });

        btnPlayPause.addEventListener('click', () => {
            if (!video.src) {
                statusDiv.textContent = "Selecione ou envie um vídeo primeiro!";
                return;
            }
            if (video.paused) {
                video.play();
                statusDiv.textContent = "Reproduzindo...";
            } else {
                video.pause();
                statusDiv.textContent = "Pausado.";
            }
        });

        inputArquivo.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                document.querySelectorAll('.item-video').forEach(el => el.classList.remove('ativo'));
                carregarFonteVideo(URL.createObjectURL(file), false);
            }
        });

        btnCarregarUrl.addEventListener('click', () => {
            const url = inputUrl.value.trim();
            if (url) {
                document.querySelectorAll('.item-video').forEach(el => el.classList.remove('ativo'));
                carregarFonteVideo(url, true);
            }
        });

        video.addEventListener('loadeddata', () => {
            statusDiv.textContent = "Pronto! Clique em Play se não iniciar sozinho.";
            const proporcao = video.videoHeight / video.videoWidth;
            const alturaAscii = Math.floor(larguraAscii * proporcao * 0.55);

            canvasTemp.width = larguraAscii;
            canvasTemp.height = alturaAscii;
            canvasDisplay.width = larguraAscii * larguraChar;
            canvasDisplay.height = alturaAscii * alturaChar;

            video.play().catch(() => {
                statusDiv.textContent = "Clique em '▶ Reproduzir / Pausar' para iniciar o som e o vídeo.";
            });
        });

        video.addEventListener('play', () => {
            requestAnimationFrame(processarQuadro);
        });

        function processarQuadro() {
            if (video.paused || video.ended) return;

            const colunas = canvasTemp.width;
            const linhas = canvasTemp.height;

            if (colunas > 0 && linhas > 0) {
                try {
                    ctxTemp.drawImage(video, 0, 0, colunas, linhas);
                    const frameData = ctxTemp.getImageData(0, 0, colunas, linhas).data;

                    ctxDisplay.fillStyle = '#000000';
                    ctxDisplay.fillRect(0, 0, canvasDisplay.width, canvasDisplay.height);
                    ctxDisplay.font = `bold ${tamanhoFonte}px "Courier New", Courier, monospace`;

                    for (let y = 0; y < linhas; y++) {
                        for (let x = 0; x < colunas; x++) {
                            const idx = (y * colunas + x) * 4;
                            const r = frameData[idx];
                            const g = frameData[idx + 1];
                            const b = frameData[idx + 2];

                            const brilho = (r + g + b) / 3;
                            const charIdx = Math.floor((brilho / 255) * (ASCII_CHARS.length - 1));
                            const char = ASCII_CHARS[charIdx];

                            if (char === ' ') continue;

                            ctxDisplay.fillStyle = `rgb(${r},${g},${b})`;
                            ctxDisplay.fillText(char, x * larguraChar, (y + 1) * alturaChar);
                        }
                    }
                } catch (e) {
                    statusDiv.textContent = "Erro de bloqueio CORS no vídeo externo.";
                }
            }

            requestAnimationFrame(processarQuadro);
        }
    </script>
</body>
</html>
