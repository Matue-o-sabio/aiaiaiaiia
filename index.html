<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeo ASCII Correção</title>
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: monospace;
        }

        .painel {
            background-color: #161b22;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #30363d;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 90%;
            max-width: 550px;
        }

        .grupo-campo {
            display: flex;
            gap: 10px;
        }

        input[type="url"], input[type="file"] {
            flex: 1;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #30363d;
            background-color: #0d1117;
            color: #fff;
            font-size: 13px;
        }

        button {
            padding: 8px 16px;
            font-size: 14px;
            background-color: #238636;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover { background-color: #2ea043; }

        #status {
            margin-bottom: 10px;
            color: #58a6ff;
            font-size: 14px;
        }

        #container-canvas {
            background-color: #000;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.1);
        }

        canvas { display: block; }
        video { display: none; }
    </style>
</head>
<body>

    <h2>Tocador de Vídeo ASCII</h2>

    <div class="painel">
        <label><b>Opção 1: Escolher arquivo do seu computador</b></label>
        <input type="file" id="input-arquivo" accept="video/mp4,video/webm">

        <hr style="border:0; border-top:1px solid #30363d; width:100%; margin: 5px 0;">

        <label><b>Opção 2: URL direta de arquivo (.mp4)</b></label>
        <div class="grupo-campo">
            <input type="url" id="input-url" placeholder="URL do vídeo (.mp4)" value="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4">
            <button id="btn-carregar">Rodar URL</button>
        </div>
    </div>

    <div id="status">Aguardando vídeo...</div>

    <div id="container-canvas">
        <canvas id="ascii-canvas"></canvas>
    </div>

    <video id="video-oculto" loop playsinline muted></video>
    <canvas id="canvas-temp" style="display:none;"></canvas>

    <script>
        const ASCII_CHARS = " .'`^\",:;Il!i><~+_-?][}{1)(|/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$";

        const inputArquivo = document.getElementById('input-arquivo');
        const inputUrl = document.getElementById('input-url');
        const btnCarregar = document.getElementById('btn-carregar');
        const statusDiv = document.getElementById('status');
        const video = document.getElementById('video-oculto');

        const canvasDisplay = document.getElementById('ascii-canvas');
        const ctxDisplay = canvasDisplay.getContext('2d');

        const canvasTemp = document.getElementById('canvas-temp');
        const ctxTemp = canvasTemp.getContext('2d');

        const larguraAscii = 90;
        const tamanhoFonte = 10;
        const larguraChar = tamanhoFonte * 0.6;
        const alturaChar = tamanhoFonte * 0.9;

        // Carregar arquivo local
        inputArquivo.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                statusDiv.textContent = "A carregar vídeo local...";
                video.removeAttribute('crossOrigin');
                video.src = URL.createObjectURL(file);
                iniciarPlay();
            }
        });

        // Carregar por URL
        btnCarregar.addEventListener('click', () => {
            const url = inputUrl.value.trim();
            if (!url) return;

            statusDiv.textContent = "A carregar vídeo via URL...";
            video.setAttribute('crossOrigin', 'anonymous');
            video.src = url;
            video.load();
            iniciarPlay();
        });

        function iniciarPlay() {
            video.play().then(() => {
                statusDiv.textContent = "Vídeo a ser reproduzido!";
            }).catch(err => {
                console.error(err);
                statusDiv.textContent = "Erro de Autoplay ou CORS ao tentar rodar o vídeo.";
            });
        }

        // Aguarda os dados do vídeo estarem carregados para calcular as dimensões reais
        video.addEventListener('loadedmetadata', () => {
            const proporcao = video.videoHeight / video.videoWidth;
            const alturaAscii = Math.floor(larguraAscii * proporcao * 0.55);

            canvasTemp.width = larguraAscii;
            canvasTemp.height = alturaAscii;

            canvasDisplay.width = larguraAscii * larguraChar;
            canvasDisplay.height = alturaAscii * alturaChar;
        });

        video.addEventListener('play', () => {
            requestAnimationFrame(processarQuadro);
        });

        function processarQuadro() {
            if (video.paused || video.ended) return;

            const colunas = canvasTemp.width;
            const linhas = canvasTemp.height;

            if (colunas > 0 && linhas > 0) {
                try {
                    ctxTemp.drawImage(video, 0, 0, colunas, linhas);
                    const frameData = ctxTemp.getImageData(0, 0, colunas, linhas).data;

                    ctxDisplay.fillStyle = '#000000';
                    ctxDisplay.fillRect(0, 0, canvasDisplay.width, canvasDisplay.height);
                    ctxDisplay.font = `bold ${tamanhoFonte}px "Courier New", Courier, monospace`;

                    for (let y = 0; y < linhas; y++) {
                        for (let x = 0; x < colunas; x++) {
                            const idx = (y * colunas + x) * 4;
                            const r = frameData[idx];
                            const g = frameData[idx + 1];
                            const b = frameData[idx + 2];

                            const brilho = (r + g + b) / 3;
                            const charIdx = Math.floor((brilho / 255) * (ASCII_CHARS.length - 1));
                            const char = ASCII_CHARS[charIdx];

                            if (char === ' ') continue;

                            ctxDisplay.fillStyle = `rgb(${r},${g},${b})`;
                            ctxDisplay.fillText(char, x * larguraChar, (y + 1) * alturaChar);
                        }
                    }
                } catch (e) {
                    statusDiv.textContent = "Erro de segurança CORS ao ler o vídeo de servidor externo.";
                }
            }

            requestAnimationFrame(processarQuadro);
        }
    </script>
</body>
</html>
