<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeo ASCII com Som e Controle de Volume</title>
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: monospace;
        }

        .painel {
            background-color: #161b22;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #30363d;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 90%;
            max-width: 550px;
        }

        .grupo-campo {
            display: flex;
            gap: 10px;
        }

        .controles-audio {
            display: flex;
            align-items: center;
            gap: 12px;
            background-color: #0d1117;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #30363d;
        }

        input[type="url"], input[type="file"] {
            flex: 1;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #30363d;
            background-color: #0d1117;
            color: #fff;
            font-size: 13px;
        }

        input[type="range"] {
            flex: 1;
            cursor: pointer;
        }

        button {
            padding: 8px 16px;
            font-size: 14px;
            background-color: #238636;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover { background-color: #2ea043; }

        #status {
            margin-bottom: 10px;
            color: #58a6ff;
            font-size: 14px;
        }

        #container-canvas {
            background-color: #000;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.1);
        }

        canvas { display: block; }
        video { display: none; }
    </style>
</head>
<body>

    <h2>Tocador de Vídeo ASCII</h2>

    <div class="painel">
        <label><b>Opção 1: Escolher arquivo do seu computador</b></label>
        <input type="file" id="input-arquivo" accept="video/mp4,video/webm">

        <hr style="border:0; border-top:1px solid #30363d; width:100%; margin: 5px 0;">

        <label><b>Opção 2: URL direta de arquivo (.mp4)</b></label>
        <div class="grupo-campo">
            <input type="url" id="input-url" placeholder="URL do vídeo (.mp4)" value="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4">
            <button id="btn-carregar">Rodar URL</button>
        </div>

        <hr style="border:0; border-top:1px solid #30363d; width:100%; margin: 5px 0;">

        <label><b>Controle de Áudio</b></label>
        <div class="controles-audio">
            <button id="btn-mute">Mudar Mudo</button>
            <input type="range" id="slider-volume" min="0" max="1" step="0.05" value="0.5">
            <span id="valor-volume">50%</span>
        </div>
    </div>

    <div id="status">Aguardando vídeo...</div>

    <div id="container-canvas">
        <canvas id="ascii-canvas"></canvas>
    </div>
