<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Vídeo em ASCII Online</title>
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: monospace;
        }

        .controles {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            width: 90%;
            max-width: 600px;
        }

        input[type="url"] {
            flex: 1;
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px solid #30363d;
            background-color: #161b22;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        input[type="url"]:focus {
            border-color: #58a6ff;
        }

        button {
            padding: 10px 20px;
            font-size: 14px;
            background-color: #238636;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #2ea043;
        }

        #container-canvas {
            background-color: #000;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.1);
        }

        canvas {
            display: block;
        }

        /* O elemento de vídeo real fica escondido */
        video {
            display: none;
        }
    </style>
</head>
<body>

    <h2>Tocador de Vídeo ASCII via URL</h2>

    <div class="controles">
        <input type="url" id="url-video" placeholder="Cole o link direto do vídeo (.mp4)" value="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4">
        <button id="btn-carregar">Carregar e Rodar</button>
    </div>

    <div id="container-canvas">
        <canvas id="ascii-canvas"></canvas>
    </div>

    <!-- Elementos ocultos para processamento dos quadros -->
    <video id="video-oculto" crossOrigin="anonymous" loop playsinline></video>
    <canvas id="canvas-temp" style="display:none;"></canvas>

    <script>
        const ASCII_CHARS = " .'`^\",:;Il!i><~+_-?][}{1)(|/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$";

        const urlInput = document.getElementById('url-video');
        const btnCarregar = document.getElementById('btn-carregar');
        const video = document.getElementById('video-oculto');

        const canvasDisplay = document.getElementById('ascii-canvas');
        const ctxDisplay = canvasDisplay.getContext('2d');

        const canvasTemp = document.getElementById('canvas-temp');
        const ctxTemp = canvasTemp.getContext('2d');

        // Configurações de renderização do ASCII
        const larguraAscii = 100; // Quantidade de caracteres na largura
        const tamanhoFonte = 10;
        const larguraChar = tamanhoFonte * 0.6;
        const alturaChar = tamanhoFonte * 0.9;

        btnCarregar.addEventListener('click', () => {
            const url = urlInput.value.trim();
            if (!url) return;

            video.src = url;
            video.load();
            video.play().catch(e => alert("Erro ao carregar o vídeo. Verifique se o link é direto (.mp4) e se o site de origem permite CORS."));
        });

        video.addEventListener('play', () => {
            // Ajusta dimensões baseadas na proporção do vídeo
            const proporcao = video.videoHeight / video.videoWidth;
            const alturaAscii = Math.floor(larguraAscii * proporcao * 0.55);

            canvasTemp.width = larguraAscii;
            canvasTemp.height = alturaAscii;

            canvasDisplay.width = larguraAscii * larguraChar;
            canvasDisplay.height = alturaAscii * alturaChar;

            processarQuadro();
        });

        function processarQuadro() {
            if (video.paused || video.ended) return;

            const colunas = canvasTemp.width;
            const linhas = canvasTemp.height;

            // Desenha o quadro atual do vídeo no canvas temporário
            ctxTemp.drawImage(video, 0, 0, colunas, linhas);
            const frameData = ctxTemp.getImageData(0, 0, colunas, linhas).data;

            // Limpa o canvas de exibição com fundo preto
            ctxDisplay.fillStyle = '#000000';
            ctxDisplay.fillRect(0, 0, canvasDisplay.width, canvasDisplay.height);
            ctxDisplay.font = `bold ${tamanhoFonte}px "Courier New", Courier, monospace`;

            for (let y = 0; y < linhas; y++) {
                for (let x = 0; x < colunas; x++) {
                    const idx = (y * colunas + x) * 4;
                    const r = frameData[idx];
                    const g = frameData[idx + 1];
                    const b = frameData[idx + 2];

                    // Calcula o brilho para escolher o caractere ASCII
                    const brilho = (r + g + b) / 3;
                    const charIdx = Math.floor((brilho / 255) * (ASCII_CHARS.length - 1));
                    const char = ASCII_CHARS[charIdx];

                    if (char === ' ') continue;

                    // Desenha a letra com a cor exata do pixel
                    ctxDisplay.fillStyle = `rgb(${r},${g},${b})`;
                    ctxDisplay.fillText(char, x * larguraChar, (y + 1) * alturaChar);
                }
            }

            // Solicita o próximo quadro em sincronia com o navegador
            requestAnimationFrame(processarQuadro);
        }
    </script>
</body>
</html>
